# Local development alias using the installed PHP 8.5 FPM pool.
Alias /my-try /home/alexv/__AI/simple_cpp/simple_cpp_01/compiler/my-try

<Directory /home/alexv/__AI/simple_cpp/simple_cpp_01/compiler/my-try>
    Options -Indexes
    AllowOverride None
    Require local
    DirectoryIndex disabled
    DirectoryIndex main.php
</Directory>

# Location matching overrides the localhost virtual host's PHP 8.3 FilesMatch.
<LocationMatch "^/my-try/.*\.php$">
    SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
</LocationMatch>
