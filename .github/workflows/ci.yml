name: Compiler and runtime
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/v0.1/
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y clang libc++-dev libc++abi-dev ninja-build mold
      - name: Build
        run: |
          test ! -e v0.1
          cmake --preset default
          cmake --build --preset default
      - name: Check compiler entry and native runtime
        run: ctest --preset default --no-tests=error -R '^(compiler_entry|byte_consumer|checked_conversions)$'
