name: CI

on:
  push:
    branches:
      - develop
      - main
      - "codex/**"
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      SCPP_CI_ARTIFACT_DIR: /tmp/scpp_ci_artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native_check: true
            build_options: true
          - os: macos-latest
            native_check: true
            build_options: false
          - os: windows-latest
            native_check: false
            build_options: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build g++ pkg-config libgtk-3-dev xvfb imagemagick dbus-x11
            if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
              sudo apt-get install -y libwebkit2gtk-4.1-dev
            else
              sudo apt-get install -y libwebkit2gtk-4.0-dev
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            command -v ninja >/dev/null 2>&1 || brew install ninja
            command -v pkg-config >/dev/null 2>&1 || brew install pkg-config
          else
            echo "No extra build tools needed for this Windows smoke slice."
          fi

      - name: PHP syntax checks
        shell: bash
        run: |
          set -euo pipefail
          php -v
          php -l bin/project_services.php
          php -l generators/php/src/Analysis/RuntimeShallowSourceGenerator.php
          php -l generators/php/src/Stan/StanPhpRuntimeFunctionCatalog.php
          php -l tests/tools/test_scpp_ui_module.php
          php -l tests/tools/test_scpp_webview_module.php

      - name: UI module smoke
        shell: bash
        run: |
          set -euo pipefail
          php tests/tools/test_scpp_ui_module.php
          php tests/tools/test_scpp_webview_module.php

      - name: Build options smoke
        if: matrix.build_options
        shell: bash
        run: php tests/tools/test_scpp_build_options.php

      - name: UI runtime C++ compile smoke
        if: matrix.native_check
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++23 -Iruntime/include -DSCPP_HAS_UI=0 -c runtime/include/modules/ui/ui.cpp -o ui_disabled.o
          c++ -std=c++23 -Iruntime/include -DSCPP_HAS_UI=1 -c runtime/include/modules/ui/ui.cpp -o ui_enabled.o
          c++ -std=c++23 -Iruntime/include -DSCPP_HAS_UI=0 -DSCPP_HAS_WEBVIEW=0 -c runtime/include/modules/webview/webview.cpp -o webview_disabled.o
          c++ -std=c++23 -Iruntime/include -DSCPP_HAS_UI=0 -DSCPP_HAS_WEBVIEW=0 -c tests/native/webview_compile.cpp -o webview_compile_disabled.o
          c++ -std=c++23 -Iruntime/include -DSCPP_HAS_UI=1 -DSCPP_HAS_WEBVIEW=1 -c runtime/include/modules/webview/webview.cpp -o webview_enabled.o

      - name: Build Windows Win32 UI smoke app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw "Visual Studio C++ tools were not found."
          }
          $vsDevCmd = Join-Path $installPath "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$vsDevCmd`" -arch=x64 && cl /nologo /EHsc /std:c++latest /I runtime/include /DSCPP_HAS_UI=1 /DSCPP_UI_BACKEND_WIN32=1 tests\native\ui_smoke_windows.cpp runtime\include\modules\ui\ui.cpp /link user32.lib gdi32.lib shell32.lib /out:ui_smoke_windows.exe"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Windows WebView2 smoke app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nuget = Get-Command nuget -ErrorAction SilentlyContinue
          if ($nuget) {
            $nugetCommand = $nuget.Source
          } else {
            Invoke-WebRequest "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "nuget.exe"
            $nugetCommand = (Resolve-Path ".\nuget.exe").Path
          }
          & $nugetCommand install Microsoft.Web.WebView2 -OutputDirectory .nuget-packages -ExcludeVersion -NonInteractive

          $webView2Root = (Resolve-Path ".nuget-packages\Microsoft.Web.WebView2").Path
          $webView2Include = Join-Path $webView2Root "build\native\include"
          $webView2Lib = Join-Path $webView2Root "build\native\x64\WebView2LoaderStatic.lib"
          if (-not (Test-Path $webView2Lib)) {
            $webView2Lib = Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"
          }
          if (-not (Test-Path $webView2Lib)) {
            throw "WebView2 loader library was not found under $webView2Root."
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw "Visual Studio C++ tools were not found."
          }
          $vsDevCmd = Join-Path $installPath "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$vsDevCmd`" -arch=x64 && cl /nologo /EHsc /std:c++latest /I runtime/include /I `"$webView2Include`" /DSCPP_HAS_UI=1 /DSCPP_UI_BACKEND_WIN32=1 /DSCPP_HAS_WEBVIEW=1 /DSCPP_WEBVIEW_BACKEND_WEBVIEW2=1 tests\native\webview_smoke_windows.cpp runtime\include\modules\ui\ui.cpp runtime\include\modules\webview\webview.cpp /link user32.lib gdi32.lib shell32.lib ole32.lib advapi32.lib `"$webView2Lib`" /out:webview_smoke_windows.exe"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Linux GTK UI smoke app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -Iruntime/include \
            -DSCPP_HAS_UI=1 -DSCPP_UI_BACKEND_GTK=1 \
            tests/native/ui_smoke_desktop.cpp runtime/include/modules/ui/ui.cpp \
            $(pkg-config --cflags --libs gtk+-3.0) \
            -o ui_smoke_gtk

      - name: Launch Linux GTK UI smoke app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCPP_CI_ARTIFACT_DIR"
          screenshot_path="$SCPP_CI_ARTIFACT_DIR/linux-gtk-ui-${GITHUB_RUN_ID}.png"
          xvfb-run -a --server-args="-screen 0 1024x768x24" bash -c '
            set -euo pipefail
            ./ui_smoke_gtk &
            pid=$!
            sleep 3
            import -window root "'"$screenshot_path"'"
            wait "$pid"
          '
          python3 tests/tools/check_ui_screenshot.py "$screenshot_path" --min-width 640 --min-height 420

      - name: Upload Linux GTK UI screenshot
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-gtk-ui-screenshot-${{ github.run_id }}
          path: /tmp/scpp_ci_artifacts/linux-gtk-ui-${{ github.run_id }}.png
          if-no-files-found: warn

      - name: Build Linux WebKitGTK WebView smoke app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          webkit_pkg="$(pkg-config --exists webkit2gtk-4.1 && echo webkit2gtk-4.1 || echo webkit2gtk-4.0)"
          g++ -std=c++23 -Iruntime/include \
            -DSCPP_HAS_UI=1 -DSCPP_UI_BACKEND_GTK=1 \
            -DSCPP_HAS_WEBVIEW=1 -DSCPP_WEBVIEW_BACKEND_WEBKITGTK=1 \
            tests/native/webview_smoke_desktop.cpp runtime/include/modules/ui/ui.cpp runtime/include/modules/webview/webview.cpp \
            $(pkg-config --cflags --libs gtk+-3.0 "$webkit_pkg") \
            -o webview_smoke_gtk

      - name: Launch Linux WebKitGTK WebView smoke app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCPP_CI_ARTIFACT_DIR"
          screenshot_path="$SCPP_CI_ARTIFACT_DIR/linux-webview-ui-${GITHUB_RUN_ID}.png"
          xvfb-run -a --server-args="-screen 0 1024x768x24" dbus-run-session -- bash -c '
            set -euo pipefail
            GDK_BACKEND=x11 WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 ./webview_smoke_gtk &
            pid=$!
            sleep 5
            import -window root "'"$screenshot_path"'"
            convert "'"$screenshot_path"'" PNG24:"'"$screenshot_path"'"
            wait "$pid"
          '
          python3 tests/tools/check_ui_screenshot.py "$screenshot_path" --min-width 640 --min-height 420

      - name: Upload Linux WebView screenshot
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-webview-screenshot-${{ github.run_id }}
          path: /tmp/scpp_ci_artifacts/linux-webview-ui-${{ github.run_id }}.png
          if-no-files-found: warn

      - name: Android NDK UI compile smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++" \
            -std=c++23 -Iruntime/include -DSCPP_HAS_UI=0 \
            -c runtime/include/modules/ui/ui.cpp -o ui_android_runtime.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++" \
            -std=c++23 -Iruntime/include -DSCPP_HAS_UI=0 \
            -c tests/native/ui_android_compile.cpp -o ui_android_compile.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++" \
            -std=c++23 -Iruntime/include -DSCPP_HAS_UI=0 \
            -DSCPP_HAS_WEBVIEW=1 -DSCPP_WEBVIEW_BACKEND_ANDROID_WEBVIEW=1 \
            -c runtime/include/modules/webview/webview.cpp -o webview_android_runtime.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++" \
            -std=c++23 -Iruntime/include -DSCPP_HAS_UI=0 \
            -DSCPP_HAS_WEBVIEW=1 -DSCPP_WEBVIEW_BACKEND_ANDROID_WEBVIEW=1 \
            -c tests/native/webview_android_compile.cpp -o webview_android_compile.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++" \
            -std=c++23 -Iruntime/include -DSCPP_HAS_UI=0 \
            -DSCPP_HAS_WEBVIEW=1 -DSCPP_WEBVIEW_BACKEND_ANDROID_WEBVIEW=1 \
            -shared -fPIC \
            tests/native/android_webview_smoke/simplecpp_webview_smoke.cpp runtime/include/modules/webview/webview.cpp \
            -o libsimplecpp_webview_smoke.so

      - name: Android WebView activity compile smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          android_jar="$ANDROID_HOME/platforms/android-35/android.jar"
          if [ ! -f "$android_jar" ]; then
            android_jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -n 1)"
          fi
          test -f "$android_jar"
          mkdir -p android_webview_smoke_classes
          javac \
            -source 17 -target 17 \
            -classpath "$android_jar" \
            -d android_webview_smoke_classes \
            tests/native/android_webview_smoke/src/dev/simplecpp/smoke/ScppWebViewSmokeActivity.java

      - name: Android WebView APK package smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          android_jar="$ANDROID_HOME/platforms/android-35/android.jar"
          if [ ! -f "$android_jar" ]; then
            android_jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -n 1)"
          fi
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -f "$android_jar"
          test -n "$build_tools"

          mkdir -p android_webview_smoke_classes android_webview_smoke_dex android_webview_smoke_package/lib/arm64-v8a
          javac \
            -source 17 -target 17 \
            -classpath "$android_jar" \
            -d android_webview_smoke_classes \
            tests/native/android_webview_smoke/src/dev/simplecpp/smoke/ScppWebViewSmokeActivity.java
          "$build_tools/d8" \
            --min-api 23 \
            --output android_webview_smoke_dex \
            android_webview_smoke_classes/dev/simplecpp/smoke/ScppWebViewSmokeActivity.class
          "$build_tools/aapt2" compile \
            --dir tests/native/android_webview_smoke/res \
            -o android_webview_smoke_res.zip
          "$build_tools/aapt2" link \
            -I "$android_jar" \
            --manifest tests/native/android_webview_smoke/AndroidManifest.xml \
            -o android_webview_smoke-unsigned.apk \
            android_webview_smoke_res.zip
          cp android_webview_smoke_dex/classes.dex android_webview_smoke_package/classes.dex
          cp libsimplecpp_webview_smoke.so android_webview_smoke_package/lib/arm64-v8a/libsimplecpp_webview_smoke.so
          (cd android_webview_smoke_package && zip -qr ../android_webview_smoke-unsigned.apk classes.dex lib)
          "$build_tools/zipalign" -f 4 android_webview_smoke-unsigned.apk android_webview_smoke-aligned.apk
          keytool \
            -genkeypair \
            -keystore android_webview_smoke-debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Simple C++"
          "$build_tools/apksigner" sign \
            --ks android_webview_smoke-debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out android_webview_smoke-signed.apk \
            android_webview_smoke-aligned.apk
          "$build_tools/apksigner" verify android_webview_smoke-signed.apk
          mkdir -p "$SCPP_CI_ARTIFACT_DIR"
          cp android_webview_smoke-signed.apk "$SCPP_CI_ARTIFACT_DIR/android-webview-smoke-${GITHUB_RUN_ID}.apk"
          test -s "$SCPP_CI_ARTIFACT_DIR/android-webview-smoke-${GITHUB_RUN_ID}.apk"

      - name: Upload Android WebView smoke APK
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: android-webview-smoke-apk-${{ github.run_id }}
          path: /tmp/scpp_ci_artifacts/android-webview-smoke-${{ github.run_id }}.apk
          if-no-files-found: warn

      - name: Build macOS UI smoke app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++23 -x objective-c++ -Iruntime/include \
            -DSCPP_HAS_UI=1 -DSCPP_UI_BACKEND_APPKIT=1 \
            tests/native/ui_smoke_macos.mm runtime/include/modules/ui/ui.cpp \
            -framework Cocoa \
            -o ui_smoke_macos

      - name: Launch macOS UI smoke app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCPP_CI_ARTIFACT_DIR"
          screenshot_path="$SCPP_CI_ARTIFACT_DIR/macos-ui-${GITHUB_RUN_ID}.png"
          pid_path="$SCPP_CI_ARTIFACT_DIR/ui_smoke_macos-${GITHUB_RUN_ID}.pid"
          ./ui_smoke_macos &
          echo $! > "$pid_path"
          sleep 3
          screencapture -x "$screenshot_path"
          wait "$(cat "$pid_path")"
          python3 tests/tools/check_ui_screenshot.py "$screenshot_path" --min-width 640 --min-height 420

      - name: Upload macOS UI screenshot
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-screenshot-${{ github.run_id }}
          path: /tmp/scpp_ci_artifacts/macos-ui-${{ github.run_id }}.png
          if-no-files-found: warn

      - name: Build macOS WKWebView smoke app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++23 -x objective-c++ -Iruntime/include \
            -DSCPP_HAS_UI=1 -DSCPP_UI_BACKEND_APPKIT=1 \
            -DSCPP_HAS_WEBVIEW=1 -DSCPP_WEBVIEW_BACKEND_WKWEBVIEW=1 \
            tests/native/webview_smoke_macos.mm runtime/include/modules/ui/ui.cpp runtime/include/modules/webview/webview.cpp \
            -framework Cocoa -framework WebKit \
            -o webview_smoke_macos

      - name: Launch macOS WKWebView smoke app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCPP_CI_ARTIFACT_DIR"
          screenshot_path="$SCPP_CI_ARTIFACT_DIR/macos-webview-ui-${GITHUB_RUN_ID}.png"
          pid_path="$SCPP_CI_ARTIFACT_DIR/webview_smoke_macos-${GITHUB_RUN_ID}.pid"
          ./webview_smoke_macos &
          echo $! > "$pid_path"
          sleep 4
          screencapture -x "$screenshot_path"
          wait "$(cat "$pid_path")"
          python3 tests/tools/check_ui_screenshot.py "$screenshot_path" --min-width 640 --min-height 420

      - name: Upload macOS WebView screenshot
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-webview-screenshot-${{ github.run_id }}
          path: /tmp/scpp_ci_artifacts/macos-webview-ui-${{ github.run_id }}.png
          if-no-files-found: warn

      - name: Build iOS Simulator UI smoke app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SimpleCppUiIOS.app
          cp tests/native/ios_smoke/Info.plist SimpleCppUiIOS.app/Info.plist
          IOS_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          IOS_TARGET="arm64-apple-ios15.0-simulator"
          clang++ -std=c++23 -x objective-c++ -target "$IOS_TARGET" -isysroot "$IOS_SDK" \
            -Iruntime/include \
            -DSCPP_HAS_UI=1 -DSCPP_UI_BACKEND_UIKIT=1 \
            tests/native/ui_smoke_ios.mm runtime/include/modules/ui/ui.cpp \
            -framework UIKit -framework Foundation \
            -o SimpleCppUiIOS.app/SimpleCppUiIOS
          codesign --force --sign - SimpleCppUiIOS.app

      - name: Launch iOS Simulator UI smoke app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCPP_CI_ARTIFACT_DIR"
          screenshot_path="$SCPP_CI_ARTIFACT_DIR/ios-ui-${GITHUB_RUN_ID}.png"
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown/ { print $2; exit }')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" SimpleCppUiIOS.app
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" dev.simplecpp.ui-smoke
          sleep 2
          xcrun simctl io "$DEVICE_ID" screenshot "$screenshot_path"
          xcrun simctl terminate "$DEVICE_ID" dev.simplecpp.ui-smoke || true
          python3 tests/tools/check_ui_screenshot.py "$screenshot_path" --min-width 300 --min-height 600

      - name: Upload iOS UI screenshot
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-screenshot-${{ github.run_id }}
          path: /tmp/scpp_ci_artifacts/ios-ui-${{ github.run_id }}.png
          if-no-files-found: warn

      - name: Build iOS Simulator WKWebView smoke app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SimpleCppWebViewIOS.app
          cp tests/native/ios_webview_smoke/Info.plist SimpleCppWebViewIOS.app/Info.plist
          IOS_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          IOS_TARGET="arm64-apple-ios15.0-simulator"
          clang++ -std=c++23 -x objective-c++ -target "$IOS_TARGET" -isysroot "$IOS_SDK" \
            -Iruntime/include \
            -DSCPP_HAS_UI=1 -DSCPP_UI_BACKEND_UIKIT=1 \
            -DSCPP_HAS_WEBVIEW=1 -DSCPP_WEBVIEW_BACKEND_UIKIT_WKWEBVIEW=1 \
            tests/native/webview_smoke_ios.mm runtime/include/modules/ui/ui.cpp runtime/include/modules/webview/webview.cpp \
            -framework UIKit -framework Foundation -framework WebKit \
            -o SimpleCppWebViewIOS.app/SimpleCppWebViewIOS
          codesign --force --sign - SimpleCppWebViewIOS.app

      - name: Launch iOS Simulator WKWebView smoke app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCPP_CI_ARTIFACT_DIR"
          screenshot_path="$SCPP_CI_ARTIFACT_DIR/ios-webview-ui-${GITHUB_RUN_ID}.png"
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ { print $2; exit }')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" SimpleCppWebViewIOS.app
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" dev.simplecpp.webview-smoke
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot "$screenshot_path"
          xcrun simctl terminate "$DEVICE_ID" dev.simplecpp.webview-smoke || true
          python3 tests/tools/check_ui_screenshot.py "$screenshot_path" --min-width 300 --min-height 600

      - name: Upload iOS WebView screenshot
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ios-webview-screenshot-${{ github.run_id }}
          path: /tmp/scpp_ci_artifacts/ios-webview-ui-${{ github.run_id }}.png
          if-no-files-found: warn
